version: 2
# Keep coupled toolchains in one PR so CI validates a coherent upgrade.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-actions:
        patterns:
          - "docker/*"
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    labels:
      - dependencies

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
