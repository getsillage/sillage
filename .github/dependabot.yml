version: 2
# Keep coupled toolchains in one PR so CI validates a coherent upgrade.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      infrastructure-actions:
        patterns:
          - "docker/*"
          - "reactivecircus/android-emulator-runner"
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "tailwindcss"
        versions:
          - "4.3.3"
      - dependency-name: "@tailwindcss/vite"
        versions:
          - "4.3.3"
      # React and React DOM enforce exact runtime version parity. Keep both
      # halves of a rejected release suppressed so grouping cannot split them.
      - dependency-name: "react"
        versions:
          - "19.2.8"
      - dependency-name: "react-dom"
        versions:
          - "19.2.8"
      # Node type definitions must not expose APIs newer than the Node 24
      # runtime used by local tooling, CI, and the production build image.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
    ignore:
      # Dependabot's wildcard + 2.4.x version pattern did not suppress the
      # rejected plugin pair, so keep the known-incompatible releases exact.
      - dependency-name: "org.jetbrains.kotlin.android"
        versions:
          - "2.4.10"
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions:
          - "2.4.10"
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
