name: Release

# Publish GHCR images and create a GitHub Release for version tags.
# Container images (and optional signed APKs) must come from this workflow.
# Do not attach hand-built server or container artifacts to Releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag (e.g. v0.3.0)"
        required: true
        type: string
      mode:
        description: "Publish a new immutable release or attach the missing Android APK only"
        required: true
        type: choice
        options:
          - release
          - android-only
        default: release

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: getsillage/sillage

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      revision: ${{ steps.verify.outputs.revision }}
      mode: ${{ steps.verify.outputs.mode }}
      stable: ${{ steps.verify.outputs.stable }}
    steps:
      - name: Resolve release request
        id: request
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.request.outputs.tag }}
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: scripts/check-release-version.mjs
          sparse-checkout-cone-mode: false

      - name: Verify tag, version, CI, and release state
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.request.outputs.tag }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must match vX.Y.Z or vX.Y.Z-prerelease (got: $TAG)" >&2
            exit 1
          fi
          if [ "$MODE" != "release" ] && [ "$MODE" != "android-only" ]; then
            echo "Unsupported release mode: $MODE" >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "Release tag $TAG must be annotated" >&2
            exit 1
          fi
          expected="$(git rev-parse "$TAG^{commit}")"
          actual="$(git rev-parse HEAD)"
          if [ "$expected" != "$actual" ]; then
            echo "Checkout $actual does not match tag $TAG ($expected)" >&2
            exit 1
          fi
          node .release-tooling/scripts/check-release-version.mjs "$TAG"

          stable=true
          if [[ "$TAG" == *-* ]]; then
            stable=false
          fi

          if [ "$MODE" = "release" ]; then
            tag_object="$(git rev-parse "$TAG")"
            verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')"
            if [ "$verified" != "true" ]; then
              echo "Release tag $TAG must carry a GitHub-verified signature" >&2
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; published versions are immutable" >&2
              exit 1
            fi

            ci_run="$(gh run list --workflow CI --commit "$actual" --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')"
            if [ -z "$ci_run" ]; then
              echo "No successful CI run found for release commit $actual" >&2
              exit 1
            fi
            jobs="$(gh run view "$ci_run" --json jobs --jq '.jobs[] | [.name, .conclusion] | @tsv')"
            for required in Commits Secrets Go Proto Web Docs Container "Supply Chain" E2E Android; do
              if ! grep -Fqx "$required"$'\t'"success" <<< "$jobs"; then
                echo "CI run $ci_run is missing successful required job: $required" >&2
                exit 1
              fi
            done
          else
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "android-only mode requires an existing GitHub Release for $TAG" >&2
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$actual" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: [preflight]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      tag: ${{ needs.preflight.outputs.tag }}
      revision: ${{ needs.preflight.outputs.revision }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: scripts/compose-release-notes.mjs
          sparse-checkout-cone-mode: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable tag
        if: needs.preflight.outputs.mode == 'release'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "${IMAGE}:${TAG} already exists; refusing to overwrite an immutable release tag" >&2
            exit 1
          fi

      - name: Docker metadata
        id: meta
        if: needs.preflight.outputs.mode == 'release'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.preflight.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.preflight.outputs.tag }},enable=${{ needs.preflight.outputs.stable == 'true' }}
            type=raw,value=${{ needs.preflight.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=Sillage
            org.opencontainers.image.description=Self-hosted, single-user space for private records, history review, and AI answers grounded in your own notes.
            org.opencontainers.image.source=https://github.com/getsillage/sillage
            org.opencontainers.image.url=https://github.com/getsillage/sillage
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        if: needs.preflight.outputs.mode == 'release'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.tag }}
            REVISION=${{ needs.preflight.outputs.revision }}
          provenance: true
          sbom: true

      - name: Make package public
        if: needs.preflight.outputs.mode == 'release'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN often cannot change org package visibility (API 404).
          # After the first publish, set the package to Public once in the UI if needed:
          # https://github.com/orgs/getsillage/packages
          set +e
          for attempt in 1 2 3 4 5; do
            if gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/orgs/getsillage/packages/container/sillage/visibility" \
              -f visibility=public; then
              echo "Package visibility set to public"
              exit 0
            fi
            echo "visibility update attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "::warning::Could not set package visibility via API. If anonymous docker pull fails, open the package settings and set visibility to Public."
          exit 0

      - name: Resolve published image digest
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.preflight.outputs.tag }}
          MODE: ${{ needs.preflight.outputs.mode }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "release" ]; then
            digest="$BUILT_DIGEST"
          else
            digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" | awk '$1 == "Digest:" { print $2; exit }')"
          fi
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid image digest for ${IMAGE}:${TAG}: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          REVISION: ${{ needs.preflight.outputs.revision }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Container"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Revision: \`$REVISION\`"
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- Digest: \`$DIGEST\`"
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight, container]
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: scripts/compose-release-notes.mjs
          sparse-checkout-cone-mode: false

      - name: Compose release notes
        id: notes
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          DIGEST: ${{ needs.container.outputs.digest }}
          IMAGE: ghcr.io/getsillage/sillage
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_file="$(mktemp)"
          generated_file="$(mktemp)"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" --json body --jq '.body // ""' > "$existing_file" 2>/dev/null; then
            :
          else
            : > "$existing_file"
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$(git rev-parse HEAD)" \
            --jq .body > "$generated_file" 2>/dev/null; then
            :
          else
            echo "See the commit history for ${TAG}." > "$generated_file"
          fi
          node .release-tooling/scripts/compose-release-notes.mjs \
            --tag "$TAG" \
            --image "$IMAGE" \
            --digest "$DIGEST" \
            --existing "$existing_file" \
            --generated "$generated_file" \
            --output "$notes_file"

          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Generate and scan release SBOM
        id: supply_chain
        if: needs.preflight.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/getsillage/sillage
          DIGEST: ${{ needs.container.outputs.digest }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/release-artifacts"
          prefix="Sillage-${TAG}"
          mkdir -p "$output_dir"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${IMAGE}@${DIGEST}"
          scripts/scan-container.sh "docker:${IMAGE}@${DIGEST}" "$output_dir" "$prefix"
          (
            cd "$output_dir"
            sha256sum \
              "${prefix}.spdx.json" \
              "${prefix}.cyclonedx.json" \
              "${prefix}.grype.json" \
              > "${prefix}.supply-chain.sha256"
          )
          echo "directory=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Attest release provenance
        if: needs.preflight.outputs.mode == 'release'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/getsillage/sillage
          subject-digest: ${{ needs.container.outputs.digest }}
          push-to-registry: true

      - name: Attest SPDX SBOM
        if: needs.preflight.outputs.mode == 'release'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ghcr.io/getsillage/sillage
          subject-digest: ${{ needs.container.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: ${{ runner.temp }}/release-artifacts/Sillage-${{ needs.preflight.outputs.tag }}.spdx.json
          push-to-registry: true

      - name: Publish release and supply-chain evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
          ARTIFACT_DIR: ${{ steps.supply_chain.outputs.directory }}
        run: |
          set -euo pipefail

          if [ "${{ needs.preflight.outputs.mode }}" = "release" ]; then
            create_args=(--title "Sillage ${TAG}" --notes-file "$NOTES_FILE" --verify-tag)
            if [ "${{ needs.preflight.outputs.stable }}" != "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "$TAG" "${create_args[@]}"
            gh release upload "$TAG" \
              "$ARTIFACT_DIR/Sillage-${TAG}.spdx.json" \
              "$ARTIFACT_DIR/Sillage-${TAG}.cyclonedx.json" \
              "$ARTIFACT_DIR/Sillage-${TAG}.grype.json" \
              "$ARTIFACT_DIR/Sillage-${TAG}.supply-chain.sha256"
          else
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          fi

  # Optional signed Android APK when enabled and secrets are present.
  # Repository variable: RELEASE_ANDROID_APK=true
  # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [preflight, container, release-notes]
    permissions:
      contents: write
    if: >-
      vars.RELEASE_ANDROID_APK == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set the Android signing secrets or disable RELEASE_ANDROID_APK." >&2
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Recheck Android release inputs
        run: make check-android

      - name: Decode keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > signing.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          # Properties files must not be indented.
          sed -i 's/^[[:space:]]*//' signing.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Verify and stage APK
        id: apk
        working-directory: android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner_bin="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -type f -name apksigner | sort | tail -1)"
          test -n "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs "$apk"
          out="$RUNNER_TEMP/Sillage-${{ needs.preflight.outputs.tag }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          echo "sum=$out.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          asset="Sillage-${TAG}.apk"
          checksum="${asset}.sha256"
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for candidate in "$asset" "$checksum"; do
            if grep -Fqx "$candidate" <<< "$assets"; then
              echo "Release $TAG already contains $candidate; refusing to overwrite an immutable asset" >&2
              exit 1
            fi
          done
          gh release upload "$TAG" \
            "${{ steps.apk.outputs.apk }}" \
            "${{ steps.apk.outputs.sum }}"
