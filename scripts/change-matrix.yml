# Path → required verification gates and documentation surfaces.
# Consumed by scripts/affected.mjs and scripts/check-doc-sync.mjs.
# Gates: go | proto | web | android | scale | docs | container | supply-chain | e2e | restore | upgrade

version: 1

gates:
  go: "Go modules, tests, vet, and binary build"
  proto: "Buf lint, breaking, generate, and committed gen drift"
  web: "Web lint, typecheck, unit tests, and production build"
  android: "Android unit tests, lint, APK assembly, dependency integrity, notices, vulnerability scan, release manifest policy, and API 26/API 35 device journeys"
  scale: "10k-record listing, search, sync pagination, and SQLite integrity budgets"
  docs: "Markdown links, Docker context policy, terminology, whitespace, doc-sync"
  container: "Docker image build and Compose config validation"
  supply-chain: "Runtime dependency audit, license notices, SBOM, and image vulnerability scan"
  e2e: "Fresh-instance Playwright release journeys in Chromium, Firefox, and WebKit"
  restore: "Isolated backup/restore recovery drill"
  upgrade: "Latest-stable data upgrade and backup-backed rollback drill"

rules:
  - id: proto-contract
    paths:
      - "contracts/proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "buf.lock"
    gates: [proto, go, web, android]
    docs:
      - "docs/development/api/**"
      - "docs/development/architecture.md"
      - "CONTRIBUTING.md"

  - id: database-schema
    paths:
      - "store/migration/**"
      - "store/migrator.go"
      - "store/migrator_test.go"
    gates: [go, upgrade]
    docs:
      - "docs/user/data.md"
      - "docs/development/architecture.md"

  - id: backup-restore-drill
    paths:
      - "integration/restore_drill/**"
      - "docs/user/data.md"
    gates: [go, restore, upgrade]
    docs:
      - "docs/user/data.md"

  - id: go-server
    paths:
      - "cmd/**"
      - "internal/**"
      - "server/**"
      - "store/**"
      - "go.mod"
      - "go.sum"
    gates: [go, scale, upgrade]
    docs: []

  - id: scale-acceptance
    paths:
      - "integration/scale/**"
      - "docs/development/release-readiness.md"
    gates: [go, scale]
    docs:
      - "docs/development/release-readiness.md"

  - id: release-upgrade-acceptance
    paths:
      - "integration/upgrade/**"
      - "scripts/check-upgrade.sh"
    gates: [go, upgrade, docs]
    docs:
      - "docs/development/release-readiness.md"
      - "docs/user/data.md"

  - id: web-client
    paths:
      - "apps/web/**"
    gates: [web, e2e]
    docs:
      - "docs/development/design/**"

  - id: web-artifact-policy
    paths:
      - "scripts/check-web-assets.sh"
      - "scripts/check-web-bundle.mjs"
    gates: [web, docs]
    docs:
      - "docs/development/architecture.md"
      - "docs/development/governance.md"

  - id: android-client
    paths:
      - "apps/native/androidApp/**"
      - "apps/native/build.gradle.kts"
      - "apps/native/settings.gradle.kts"
      - "apps/native/gradle.properties"
      - "apps/native/gradle/**"
      - "apps/native/gradlew"
      - "apps/native/gradlew.bat"
    gates: [android]
    docs:
      - "apps/native/androidApp/README.md"

  - id: android-artifact-policy
    paths:
      - "scripts/check-android-supply-chain.sh"
      - "scripts/generate-android-third-party-notices.mjs"
      - "third_party/licenses/android/**"
    gates: [android, docs]
    docs:
      - "apps/native/androidApp/README.md"
      - "docs/development/security.md"

  - id: shared-native-client
    paths:
      - "packages/kmp-core/**"
      - "packages/kmp-features/**"
      - "apps/native/shared-ui/**"
    gates: [android, docs]
    docs:
      - "docs/development/multiplatform.md"
      - "docs/development/architecture.md"

  - id: reserved-native-hosts
    paths:
      - "apps/native/iosApp/**"
      - "apps/native/desktopApp/**"
    gates: [docs]
    docs:
      - "docs/development/multiplatform.md"
      - "docs/development/architecture.md"

  - id: client-shared-packages
    paths:
      - "packages/typescript-sdk/**"
      - "packages/design-tokens/**"
    gates: [web, android, docs]
    docs:
      - "docs/development/multiplatform.md"

  - id: extended-contracts
    paths:
      - "contracts/http/**"
      - "contracts/events/**"
      - "contracts/schemas/**"
      - "contracts/fixtures/**"
      - "contracts/compatibility/**"
    gates: [go, web, android, docs, e2e]
    docs:
      - "docs/development/api/**"
      - "docs/development/architecture.md"

  - id: sync-contract
    paths:
      - "server/sync*.go"
      - "store/sync.go"
      - "contracts/proto/api/v1/sync_service.proto"
      - "docs/development/api/sync.md"
    gates: [go, proto, android, e2e]
    docs:
      - "docs/development/api/sync.md"

  - id: ai-behavior
    paths:
      - "server/ai*.go"
      - "server/ask*.go"
      - "store/ai*.go"
      - "store/ask*.go"
      - "apps/native/androidApp/**/ai/**"
      - "apps/native/androidApp/**/ask/**"
    gates: [go, android]
    docs:
      - "docs/user/ai.md"
      - "docs/development/product-guidance.md"

  - id: security-auth
    paths:
      - "server/auth/**"
      - "server/auth_*.go"
      - "server/attachment_*.go"
      - "internal/secret/**"
    gates: [go, proto, web, android, e2e]
    docs:
      - "docs/development/api/**"
      - "docs/development/security.md"
      - "docs/user/deployment.md"

  - id: container-deploy
    paths:
      - "scripts/Dockerfile"
      - "scripts/entrypoint.sh"
      - "scripts/compose.yaml"
      - "scripts/compose.build.yaml"
      - ".dockerignore"
    gates: [container, supply-chain, docs]
    docs:
      - "docs/user/deployment.md"

  - id: supply-chain
    paths:
      - "go.mod"
      - "go.sum"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party/licenses/**"
      - "scripts/check-sbom.mjs"
      - "scripts/check-supply-chain.sh"
      - "scripts/generate-third-party-notices.mjs"
      - "scripts/scan-container.sh"
      - "scripts/third-party-license-policy.json"
    gates: [supply-chain, docs]
    docs:
      - "docs/development/governance.md"
      - "docs/user/deployment.md"

  - id: documentation
    paths:
      - "docs/**"
      - "*.md"
      - "SUPPORT.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
    gates: [docs]
    docs: []

  - id: e2e-acceptance
    paths:
      - "apps/web/e2e/**"
      - "scripts/run-e2e.mjs"
    gates: [web, e2e]
    docs:
      - "docs/development/governance.md"

  - id: ci-workflow
    paths:
      - ".github/workflows/ci.yml"
      - "scripts/affected.mjs"
      - "scripts/change-matrix.yml"
    gates: [go, proto, web, android, scale, docs, container, supply-chain, e2e, restore, upgrade]
    docs:
      - "docs/development/governance.md"
      - "CONTRIBUTING.md"

  - id: governance-tooling
    paths:
      - "Makefile"
      - "scripts/**"
      - ".github/**"
      - ".gitleaks.toml"
      - "docs/development/governance.md"
      - "docs/development/constitution.md"
      - "docs/development/decisions/**"
    gates: [docs]
    docs:
      - "docs/development/governance.md"
      - "CONTRIBUTING.md"

  - id: release-note-input
    paths:
      - ".github/release-notes/**"
      - "apps/native/androidApp/build.gradle.kts"
      - "scripts/check-release-notes.mjs"
      - "scripts/check-release-notes.test.mjs"
    gates: [android, docs, upgrade]
    docs:
      - "CONTRIBUTING.md"
      - "docs/development/release-readiness.md"

# Default when no rule matches (full local check still recommended before release).
default_gates: [go, docs]
